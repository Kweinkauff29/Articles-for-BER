<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Real estate mobility test checklist</title><desc id="desc">Three-column checklist for buyers, sellers and REALTORS to evaluate transportation access objectively.</desc><rect width="1200" height="675" fill="#FFFFFF"/><text x="60" y="75" font-family="Arial" font-size="42" font-weight="800" fill="#002850">THE REAL-ESTATE MOBILITY TEST</text><text x="60" y="112" font-family="Arial" font-size="19" fill="#556070">A route should be tested like any other important feature of a home.</text><g font-family="Arial"><g transform="translate(60 160)"><rect width="340" height="420" fill="#002850"/><text x="28" y="55" font-size="29" font-weight="800" fill="#03AAE1">BUYERS</text><text x="28" y="105" font-size="18" fill="#FFFFFF">□ Drive the route at the time</text><text x="50" y="133" font-size="18" fill="#FFFFFF">you will actually use it.</text><text x="28" y="183" font-size="18" fill="#FFFFFF">□ Test season, school and</text><text x="50" y="211" font-size="18" fill="#FFFFFF">event conditions.</text><text x="28" y="261" font-size="18" fill="#FFFFFF">□ Identify a second route.</text><text x="28" y="311" font-size="18" fill="#FFFFFF">□ Check access to work, care,</text><text x="50" y="339" font-size="18" fill="#FFFFFF">shopping and I-75.</text><text x="28" y="389" font-size="18" fill="#FFFFFF">□ Separate current projects</text><text x="50" y="417" font-size="18" fill="#FFFFFF">from proposed projects.</text></g><g transform="translate(430 160)"><rect width="340" height="420" fill="#EEF8FB" stroke="#00A0A0" stroke-width="4"/><text x="28" y="55" font-size="29" font-weight="800" fill="#00A0A0">SELLERS</text><text x="28" y="105" font-size="18" fill="#111827">□ Describe access factually.</text><text x="28" y="155" font-size="18" fill="#111827">□ Do not guarantee a commute</text><text x="50" y="183" font-size="18" fill="#111827">time or future road project.</text><text x="28" y="233" font-size="18" fill="#111827">□ Note multiple connections</text><text x="50" y="261" font-size="18" fill="#111827">when they actually exist.</text><text x="28" y="311" font-size="18" fill="#111827">□ Keep official project links</text><text x="50" y="339" font-size="18" fill="#111827">ready for interested buyers.</text><text x="28" y="389" font-size="18" fill="#111827">□ Date-stamp infrastructure</text><text x="50" y="417" font-size="18" fill="#111827">information.</text></g><g transform="translate(800 160)"><rect width="340" height="420" fill="#FBAE24"/><text x="28" y="55" font-size="29" font-weight="800" fill="#002850">REALTORS®</text><text x="28" y="105" font-size="18" fill="#002850">□ Ask clients to define their</text><text x="50" y="133" font-size="18" fill="#002850">transportation priorities.</text><text x="28" y="183" font-size="18" fill="#002850">□ Use official, impartial sources.</text><text x="28" y="233" font-size="18" fill="#002850">□ Avoid “good traffic,” “bad area”</text><text x="50" y="261" font-size="18" fill="#002850">or subjective neighborhood labels.</text><text x="28" y="311" font-size="18" fill="#002850">□ Provide choices consistently.</text><text x="28" y="361" font-size="18" fill="#002850">□ Let clients test routes and</text><text x="50" y="389" font-size="18" fill="#002850">make their own decisions.</text></g></g><text x="60" y="625" font-family="Arial" font-size="15" fill="#556070">Professional reminder: follow fair-housing law and Article 10 of the REALTOR® Code of Ethics; do not steer.</text></svg>
