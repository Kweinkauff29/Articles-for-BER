<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Greater Estero growth and commute dashboard</title><desc id="desc">Three cards showing Estero population, Lee County population, and average commute times for Estero and Lee County.</desc><rect width="1200" height="675" fill="#FFFFFF"/>
<rect x="48" y="42" width="1104" height="590" fill="#F7FAFC" stroke="#002850" stroke-width="3"/><text x="78" y="100" font-family="Arial" font-size="38" font-weight="800" fill="#002850">GROWTH MAKES MOBILITY A HOUSING QUESTION</text><text x="78" y="140" font-family="Arial" font-size="20" fill="#556070">Current population estimates and commute measures</text><g font-family="Arial"><g transform="translate(78 190)"><rect width="318" height="285" fill="#002850"/><text x="28" y="70" font-size="64" font-weight="800" fill="#FFFFFF">38,365</text><text x="28" y="110" font-size="21" font-weight="700" fill="#03AAE1">ESTERO RESIDENTS</text><text x="28" y="154" font-size="18" fill="#FFFFFF">2025 Census estimate</text><path d="M28 205 H285" stroke="#03AAE1" stroke-width="4"/><text x="28" y="244" font-size="32" font-weight="800" fill="#FBAE24">+3.9%</text><text x="126" y="244" font-size="17" fill="#FFFFFF">since 2020 base</text></g><g transform="translate(430 190)"><rect width="318" height="285" fill="#FFFFFF" stroke="#002850" stroke-width="3"/><text x="28" y="70" font-size="64" font-weight="800" fill="#002850">875,607</text><text x="28" y="110" font-size="21" font-weight="700" fill="#00A0A0">LEE COUNTY RESIDENTS</text><text x="28" y="154" font-size="18" fill="#556070">2025 Census estimate</text><path d="M28 205 H285" stroke="#00A0A0" stroke-width="4"/><text x="28" y="244" font-size="32" font-weight="800" fill="#002850">+15.1%</text><text x="140" y="244" font-size="17" fill="#556070">since 2020 base</text></g><g transform="translate(782 190)"><rect width="292" height="285" fill="#03AAE1"/><text x="28" y="72" font-size="64" font-weight="800" fill="#002850">26.0</text><text x="28" y="110" font-size="20" font-weight="700" fill="#002850">MINUTES • ESTERO</text><path d="M28 144 H260" stroke="#FFFFFF" stroke-width="3"/><text x="28" y="208" font-size="52" font-weight="800" fill="#FFFFFF">29.4</text><text x="28" y="244" font-size="20" font-weight="700" fill="#002850">MINUTES • LEE COUNTY</text></g></g><rect x="78" y="515" width="996" height="74" fill="#EEF8FB"/><text x="100" y="548" font-family="Arial" font-size="19" font-weight="700" fill="#111827">The useful real-estate question is not “Is there traffic?”</text><text x="100" y="577" font-family="Arial" font-size="19" fill="#556070">It is “How reliable are the routes that connect this home to the buyer’s real life?”</text><text x="78" y="615" font-family="Arial" font-size="14" fill="#556070">Sources: U.S. Census Bureau QuickFacts, 2025 estimates and 2020–2024 commuting data.</text></svg>
