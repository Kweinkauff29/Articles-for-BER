<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">How a smart traffic signal system responds</title><desc id="desc">Five-step diagram showing detection, connection, analysis, adjustment and measurement in a smart traffic signal system.</desc><rect width="1200" height="675" fill="#FFFFFF"/><text x="60" y="80" font-family="Arial" font-size="42" font-weight="800" fill="#002850">HOW A SMART SIGNAL SYSTEM RESPONDS</text><text x="60" y="118" font-family="Arial" font-size="19" fill="#556070">Data supports decisions; it does not create unlimited road capacity.</text><g font-family="Arial"><g transform="translate(70 190)"><rect width="180" height="245" fill="#002850"/><text x="22" y="46" font-size="18" font-weight="800" fill="#FFFFFF">01</text><text x="22" y="92" font-size="23" font-weight="800" fill="#FFFFFF">DETECT</text><text x="22" y="132" font-size="16" fill="#FFFFFF">Radar, video,</text><text x="22" y="158" font-size="16" fill="#FFFFFF">LiDAR and traffic</text><text x="22" y="184" font-size="16" fill="#FFFFFF">readers sense demand.</text></g><g transform="translate(290 190)"><rect width="180" height="245" fill="#03AAE1"/><text x="22" y="46" font-size="18" font-weight="800" fill="#FFFFFF">02</text><text x="22" y="92" font-size="23" font-weight="800" fill="#FFFFFF">CONNECT</text><text x="22" y="132" font-size="16" fill="#FFFFFF">Fiber and network</text><text x="22" y="158" font-size="16" fill="#FFFFFF">links carry status</text><text x="22" y="184" font-size="16" fill="#FFFFFF">and volume data.</text></g><g transform="translate(510 190)"><rect width="180" height="245" fill="#00A0A0"/><text x="22" y="46" font-size="18" font-weight="800" fill="#FFFFFF">03</text><text x="22" y="92" font-size="23" font-weight="800" fill="#FFFFFF">ANALYZE</text><text x="22" y="132" font-size="16" fill="#FFFFFF">Centracs and</text><text x="22" y="158" font-size="16" fill="#FFFFFF">timing algorithms</text><text x="22" y="184" font-size="16" fill="#FFFFFF">compare conditions.</text></g><g transform="translate(730 190)"><rect width="180" height="245" fill="#FBAE24"/><text x="22" y="46" font-size="18" font-weight="800" fill="#002850">04</text><text x="22" y="92" font-size="23" font-weight="800" fill="#002850">ADJUST</text><text x="22" y="132" font-size="16" fill="#002850">Plans, cycles,</text><text x="22" y="158" font-size="16" fill="#002850">splits or offsets</text><text x="22" y="184" font-size="16" fill="#002850">may be modified.</text></g><g transform="translate(950 190)"><rect width="180" height="245" fill="#002850"/><text x="22" y="46" font-size="18" font-weight="800" fill="#FFFFFF">05</text><text x="22" y="92" font-size="23" font-weight="800" fill="#FFFFFF">MEASURE</text><text x="22" y="132" font-size="16" fill="#FFFFFF">Operators review</text><text x="22" y="158" font-size="16" fill="#FFFFFF">travel times, flow</text><text x="22" y="184" font-size="16" fill="#FFFFFF">and disruptions.</text></g></g><g stroke="#111827" stroke-width="5" fill="none"><path d="M250 312 H286"/><path d="M470 312 H506"/><path d="M690 312 H726"/><path d="M910 312 H946"/></g><g fill="#111827"><path d="M286 312 l-14 -9 v18z"/><path d="M506 312 l-14 -9 v18z"/><path d="M726 312 l-14 -9 v18z"/><path d="M946 312 l-14 -9 v18z"/></g><rect x="70" y="485" width="1060" height="120" fill="#EEF8FB"/><text x="100" y="530" font-family="Arial" font-size="22" font-weight="800" fill="#002850">WHAT RESIDENTS SEE</text><text x="100" y="565" font-family="Arial" font-size="19" fill="#111827">A longer or shorter green, a changed cycle, or a corridor recovering after pedestrians, an incident or manual control.</text><text x="100" y="592" font-family="Arial" font-size="16" fill="#556070">Lee County also uses its Traffic Operations Center to monitor malfunctions and disruptions; county camera feeds are not recorded.</text></svg>
