<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Traffic technology and safety systems</title><desc id="desc">Two-panel infographic explaining wrong-way vehicle detection and emergency vehicle signal priority.</desc><rect width="1200" height="675" fill="#FFFFFF"/><text x="60" y="78" font-family="Arial" font-size="42" font-weight="800" fill="#002850">TRAFFIC TECHNOLOGY ALSO SUPPORTS SAFETY</text><text x="60" y="116" font-family="Arial" font-size="19" fill="#556070">Two different systems, two different problems.</text><g transform="translate(60 165)" font-family="Arial"><rect width="520" height="430" fill="#EEF8FB" stroke="#D64545" stroke-width="4"/><text x="32" y="58" font-size="31" font-weight="800" fill="#D64545">WRONG-WAY DETECTION</text><g fill="#111827" font-size="19"><text x="50" y="125">1  Ramp sensors detect a wrong-way vehicle</text><text x="50" y="185">2  Flashing warnings activate for the driver</text><text x="50" y="245">3  Traffic-management and public-safety centers</text><text x="72" y="273">receive notification</text><text x="50" y="333">4  Other motorists may receive warnings</text></g><rect x="32" y="366" width="456" height="44" fill="#D64545"/><text x="54" y="395" font-size="17" font-weight="700" fill="#FFFFFF">Goal: interrupt a dangerous movement before a collision.</text></g><g transform="translate(620 165)" font-family="Arial"><rect width="520" height="430" fill="#002850"/><text x="32" y="58" font-size="31" font-weight="800" fill="#03AAE1">EMERGENCY PRIORITY</text><g fill="#FFFFFF" font-size="19"><text x="50" y="125">1  Dispatch establishes an emergency route</text><text x="50" y="185">2  Vehicle location and arrival times are shared</text><text x="50" y="245">3  Targeted intersections receive priority</text><text x="50" y="305">4  The network returns to coordinated operation</text></g><rect x="32" y="366" width="456" height="44" fill="#03AAE1"/><text x="54" y="395" font-size="17" font-weight="700" fill="#002850">Goal: improve response while limiting network disruption.</text></g><text x="60" y="630" font-family="Arial" font-size="14" fill="#556070">Sources: FDOT District 1 ITS Architecture; Lee County DOT information published by Engage Estero; Econolite Centracs Priority.</text></svg>
