<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Why traffic signals can feel out of sync</title><desc id="desc">Timeline showing pedestrians, school or side-street demand, manual police control and event surges affecting signal coordination and recovery.</desc><rect width="1200" height="675" fill="#FFFFFF"/><text x="60" y="78" font-family="Arial" font-size="41" font-weight="800" fill="#002850">WHY A COORDINATED CORRIDOR CAN FEEL “OUT OF SYNC”</text><text x="60" y="116" font-family="Arial" font-size="19" fill="#556070">Coordination is a moving target when the roadway must serve many users and events.</text><path d="M105 340 H1095" stroke="#002850" stroke-width="8"/><g font-family="Arial"><g transform="translate(110 200)"><circle cx="0" cy="140" r="28" fill="#03AAE1"/><rect x="-50" y="-25" width="190" height="100" fill="#EEF8FB"/><text x="-28" y="10" font-size="20" font-weight="800" fill="#002850">PEDESTRIAN</text><text x="-28" y="39" font-size="17" fill="#556070">Main-road crossing</text><text x="-28" y="65" font-size="17" fill="#556070">interrupts progression</text><text x="-38" y="205" font-size="19" font-weight="800" fill="#00A0A0">2–3 CYCLES</text><text x="-38" y="232" font-size="15" fill="#556070">reported recovery</text></g><g transform="translate(365 200)"><circle cx="0" cy="140" r="28" fill="#FBAE24"/><rect x="-55" y="-25" width="190" height="100" fill="#F7FAFC" stroke="#FBAE24" stroke-width="3"/><text x="-30" y="10" font-size="20" font-weight="800" fill="#002850">SCHOOL / SIDE</text><text x="-30" y="39" font-size="17" fill="#556070">Street demand adds</text><text x="-30" y="65" font-size="17" fill="#556070">competing movements</text><text x="-40" y="205" font-size="19" font-weight="800" fill="#002850">PLAN SHIFTS</text><text x="-40" y="232" font-size="15" fill="#556070">when demand changes</text></g><g transform="translate(620 200)"><circle cx="0" cy="140" r="28" fill="#D64545"/><rect x="-55" y="-25" width="190" height="100" fill="#EEF8FB"/><text x="-28" y="10" font-size="20" font-weight="800" fill="#002850">MANUAL CONTROL</text><text x="-28" y="39" font-size="17" fill="#556070">Police direct traffic</text><text x="-28" y="65" font-size="17" fill="#556070">after an event</text><text x="-40" y="205" font-size="19" font-weight="800" fill="#00A0A0">1–2 CYCLES</text><text x="-40" y="232" font-size="15" fill="#556070">reported recovery</text></g><g transform="translate(875 200)"><circle cx="0" cy="140" r="28" fill="#00A0A0"/><rect x="-55" y="-25" width="190" height="100" fill="#F7FAFC" stroke="#00A0A0" stroke-width="3"/><text x="-28" y="10" font-size="20" font-weight="800" fill="#002850">EVENT SURGE</text><text x="-28" y="39" font-size="17" fill="#556070">Special timing may</text><text x="-28" y="65" font-size="17" fill="#556070">manage arena traffic</text><text x="-40" y="205" font-size="19" font-weight="800" fill="#002850">REMOTE TUNING</text><text x="-40" y="232" font-size="15" fill="#556070">when anticipated</text></g></g><rect x="90" y="520" width="1020" height="95" fill="#002850"/><text x="120" y="558" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">COORDINATED DOES NOT MEAN EVERY DRIVER GETS A GREEN WAVE.</text><text x="120" y="590" font-family="Arial" font-size="18" fill="#03AAE1">It means the system is balancing progression with pedestrians, turning traffic, side streets, incidents and events.</text></svg>
